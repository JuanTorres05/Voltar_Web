<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Boombox Body -->
  <g transform="rotate(-3 200 200)">
    <rect x="45" y="120" width="310" height="185" rx="12" fill="#161616" stroke="#C8FF00" stroke-width="7"/>
    <!-- Handle -->
    <path d="M125 120 L125 82 L275 82 L275 120" stroke="#F0F0F0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Speaker -->
    <circle cx="115" cy="215" r="46" fill="#0A0A0A" stroke="#FF0055" stroke-width="6"/>
    <circle cx="115" cy="215" r="24" fill="#222222" stroke="#C8FF00" stroke-width="4"/>
    <circle cx="115" cy="215" r="8" fill="#C8FF00"/>
    <!-- Right Speaker -->
    <circle cx="285" cy="215" r="46" fill="#0A0A0A" stroke="#00F0FF" stroke-width="6"/>
    <circle cx="285" cy="215" r="24" fill="#222222" stroke="#C8FF00" stroke-width="4"/>
    <circle cx="285" cy="215" r="8" fill="#C8FF00"/>
    <!-- Cassette Deck -->
    <rect x="172" y="168" width="56" height="44" rx="4" fill="#0A0A0A" stroke="#F0F0F0" stroke-width="3"/>
    <circle cx="187" cy="190" r="7" fill="#C8FF00"/>
    <circle cx="213" cy="190" r="7" fill="#C8FF00"/>
    <!-- EQ Bars -->
    <rect x="174" y="232" width="8" height="32" fill="#FF0055"/>
    <rect x="186" y="220" width="8" height="44" fill="#C8FF00"/>
    <rect x="198" y="238" width="8" height="26" fill="#00F0FF"/>
    <rect x="210" y="224" width="8" height="40" fill="#C8FF00"/>
    <rect x="222" y="242" width="8" height="22" fill="#FF0055"/>
  </g>
  <!-- Soundwaves / Lightning -->
  <path d="M55 75 L75 95 L62 102 L82 122" stroke="#C8FF00" stroke-width="5" stroke-linecap="round"/>
  <path d="M345 75 L325 95 L338 102 L318 122" stroke="#00F0FF" stroke-width="5" stroke-linecap="round"/>
  <text x="200" y="352" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="34" letter-spacing="5" fill="#F0F0F0" stroke="#0A0A0A" stroke-width="2">90s CYPHER</text>
</svg>
