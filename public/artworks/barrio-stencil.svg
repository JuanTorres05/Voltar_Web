    <rect x="85" y="205" width="230" height="65" fill="#FF0055" stroke="#0A0A0A" stroke-width="6"/>
    <text x="200" y="254" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="48" letter-spacing="5" fill="#FFFFFF">VIVO</text>
  </g>
  <!-- Drips -->
  <path d="M120 265 L120 325 C120 335 132 335 132 325 L132 265 Z" fill="#FF0055"/>
  <path d="M265 188 L265 240 C265 250 275 250 275 240 L275 188 Z" fill="#C8FF00"/>
